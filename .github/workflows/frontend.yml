# -----------------------------------------------------------------------------
# Workflow Name: Frontend CI (Lint, Type-check & Build)
#
# Description:
# Quality gate for the ShopAlly Next.js frontend.
# Runs on every push and pull-request to main to verify the app compiles,
# types are correct, lint passes, and there are no known vulnerabilities.
# -----------------------------------------------------------------------------
name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: ⚙️ 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 3. Install Dependencies
        run: npm ci

      - name: 🔒 4. Audit Dependencies
        run: npm audit --audit-level=high

      - name: 🧹 5. Run ESLint
        run: npm run lint

      - name: 🏗 6. Build (type-check + compilation)
        run: npm run build
        env:
          # Provide dummy values so env-guarded startup checks pass in CI.
          # These are NOT real credentials — the build is never deployed from CI.
          NEXTAUTH_SECRET: ci-nextauth-secret-placeholder-at-least-32-chars
          AUTH_JWT_SECRET: ci-auth-jwt-secret-placeholder-at-least-32-chars-x
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8080
